<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Revision</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #667085;
    --border: #e2e6ef;
    --accent: #4f6bed;
    --danger: #d64545;
    --good: #2e9e5b;
    --shadow: 0 2px 8px rgba(20, 30, 60, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1c212b;
      --text: #e8ebf2;
      --muted: #9aa3b5;
      --border: #2c3340;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { margin: 0; font-size: 1.25rem; cursor: pointer; display: inline-block; }
  .crumbs { font-size: 0.9rem; color: var(--muted); margin-top: 4px; }
  .crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .crumbs a:hover { text-decoration: underline; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
  h2 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }
  .tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    cursor: pointer;
    position: relative;
    transition: transform 0.1s, border-color 0.1s;
  }
  .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
  .tile .icon { font-size: 2rem; }
  .tile .name { font-weight: 600; font-size: 1.1rem; margin-top: 6px; word-break: break-word; }
  .tile .meta { color: var(--muted); font-size: 0.85rem; }
  .tile .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 14px 0 0 14px; }
  .tile .actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .icon-btn {
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 0.95rem; padding: 4px 6px; border-radius: 6px;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  .add-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  input[type=text], textarea {
    flex: 1; min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font: inherit;
  }
  textarea { resize: vertical; min-height: 60px; width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.btn {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn.secondary { background: var(--border); color: var(--text); }
  button.btn.good { background: var(--good); }
  button.btn.danger { background: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; border: 2px dashed var(--border); border-radius: 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font: inherit;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
  }
  .item .body { flex: 1; min-width: 0; word-break: break-word; }
  .item .body > div { white-space: pre-wrap; }
  .item .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .wrong { color: var(--danger); }
  .right { color: var(--good); }
  .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .badge.known { background: rgba(46, 158, 91, 0.15); color: var(--good); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .toolbar .spacer { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; }

  /* Revise mode */
  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 20;
    display: flex; flex-direction: column; align-items: center; padding: 20px 16px; overflow-y: auto;
  }
  .overlay .top { width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .progress { width: 100%; max-width: 640px; height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .progress div { height: 100%; background: var(--accent); transition: width 0.2s; }
  .flashcard { width: 100%; max-width: 640px; height: 320px; perspective: 1200px; cursor: pointer; }
  .flashcard .inner { position: relative; width: 100%; height: 100%; transition: transform 0.45s; transform-style: preserve-3d; }
  .flashcard.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; font-size: 1.3rem; white-space: pre-wrap; word-break: break-word; overflow-y: auto;
  }
  .face .tag { position: absolute; top: 12px; left: 16px; font-size: 0.8rem; color: var(--muted); }
  .face.back { transform: rotateY(180deg); border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 12px 0; }
  .answer-btns { display: flex; gap: 12px; margin-top: 8px; }
  .result { text-align: center; max-width: 500px; margin-top: 40px; }
  .result .big { font-size: 3rem; font-weight: 700; }

  footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 10px 16px 30px; }
  footer button { margin: 4px; }
</style>
</head>
<body>
<header>
  <h1 id="home">📚 Lesson Revision</h1>
  <div class="crumbs" id="crumbs"></div>
</header>
<main id="app"></main>
<footer>
  Your work is saved in this browser automatically.
  <div>
    <button class="btn secondary" id="exportBtn">⬇ Back up</button>
    <button class="btn secondary" id="importBtn">⬆ Restore</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</footer>

<script>
const SUBJECTS = [
  { name: "Maths",     icon: "➗", color: "#4f6bed" },
  { name: "English",   icon: "📖", color: "#c2410c" },
  { name: "Science",   icon: "🔬", color: "#2e9e5b" },
  { name: "Spanish",   icon: "🇪🇸", color: "#d6a100" },
  { name: "Geography", icon: "🌍", color: "#0e9bb0" },
  { name: "History",   icon: "🏛️", color: "#8b5cf6" },
];
const YEARS = ["Year 7", "Year 8", "Year 9", "Year 10", "Year 11", "Year 12", "Year 13"];
const STORAGE_KEY = "lessonRevisionData.v1";

// ---------- Data ----------
// data[subject][year] = [ { id, name, lessons: [ { id, name, mistakes: [{id, wrong, right}], cards: [{id, q, a, known}] } ] } ]
let data = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {};
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { alert("Couldn't save — your browser storage may be full or blocked. Use 'Back up' to keep a copy."); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function topicsFor(subject, year) {
  data[subject] = data[subject] || {};
  data[subject][year] = data[subject][year] || [];
  return data[subject][year];
}
// Homework mistakes live apart from topics, one list per subject: data.homework["Maths"] = [{id, hw, wrong, right}]
function homeworkFor(subject) {
  data.homework = data.homework || {};
  // Merge any lists saved per year by an earlier version ("Maths|Year 9") into the subject's list
  Object.keys(data.homework).forEach(key => {
    if (key.startsWith(subject + "|")) {
      data.homework[subject] = (data.homework[subject] || []).concat(data.homework[key]);
      delete data.homework[key];
    }
  });
  data.homework[subject] = data.homework[subject] || [];
  return data.homework[subject];
}
function subjectInfo(name) { return SUBJECTS.find(s => s.name === name) || SUBJECTS[0]; }
function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

// ---------- Routing (uses the URL hash so the back button works) ----------
function go(...parts) { location.hash = parts.map(encodeURIComponent).join("/"); }
function route() { return location.hash.slice(1).split("/").filter(Boolean).map(decodeURIComponent); }
window.addEventListener("hashchange", render);
document.getElementById("home").onclick = () => go();

const app = document.getElementById("app");
let lessonTab = "mistakes";

function render() {
  const [subject, year, topicId, lessonId] = route();
  closeRevise();
  if (!subject || !SUBJECTS.some(s => s.name === subject)) return renderSubjects();
  if (!year) return renderYears(subject);
  if (year === "homework") return renderHomework(subject);
  const topic = topicsFor(subject, year).find(t => t.id === topicId);
  if (!topic) return renderTopics(subject, year);
  const lesson = topic.lessons.find(l => l.id === lessonId);
  if (!lesson) return renderLessons(subject, year, topic);
  renderLesson(subject, year, topic, lesson);
}

function setCrumbs(items) {
  const el = document.getElementById("crumbs");
  el.innerHTML = "";
  items.forEach((item, i) => {
    if (i > 0) el.append(" › ");
    if (item.go) {
      const a = document.createElement("a");
      a.textContent = item.label;
      a.onclick = () => go(...item.go);
      el.append(a);
    } else {
      el.append(item.label);
    }
  });
}

// ---------- Screens ----------
function renderSubjects() {
  setCrumbs([{ label: "Subjects" }]);
  app.innerHTML = `<h2>Choose a subject</h2><p class="sub">Pick a lesson subject to start revising.</p><div class="grid" id="grid"></div>`;
  const grid = app.querySelector("#grid");
  SUBJECTS.forEach(s => {
    const years = data[s.name] || {};
    const topicCount = Object.values(years).reduce((n, t) => n + t.length, 0);
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = `<div class="stripe" style="background:${s.color}"></div>
      <div class="icon">${s.icon}</div><div class="name">${s.name}</div>
      <div class="meta">${plural(topicCount, "topic")}</div>`;
    tile.onclick = () => go(s.name);
    grid.append(tile);
  });
}

function renderYears(subject) {
  const s = subjectInfo(subject);
  setCrumbs([{ label: "Subjects", go: [] }, { label: subject }]);
  const homework = homeworkFor(subject);
  app.innerHTML = `<h2>${s.icon} ${subject}</h2>
    <div class="grid" style="margin-bottom:24px">
      <div class="tile" id="homeworkTile">
        <div class="stripe" style="background:var(--danger)"></div>
        <div class="icon">📝</div><div class="name">Homework mistakes</div>
        <div class="meta">${plural(homework.length, "mistake")}</div>
      </div>
    </div>
    <p class="sub">Which school year are you in?</p><div class="grid" id="grid"></div>`;
  app.querySelector("#homeworkTile").onclick = () => go(subject, "homework");
  const grid = app.querySelector("#grid");
  YEARS.forEach(y => {
    const topics = (data[subject] && data[subject][y]) || [];
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = `<div class="stripe" style="background:${s.color}"></div>
      <div class="name">${y}</div><div class="meta">${plural(topics.length, "topic")}</div>`;
    tile.onclick = () => go(subject, y);
    grid.append(tile);
  });
}

function renderTopics(subject, year) {
  const s = subjectInfo(subject);
  const topics = topicsFor(subject, year);
  setCrumbs([{ label: "Subjects", go: [] }, { label: subject, go: [subject] }, { label: year }]);
  app.innerHTML = `<h2>${s.icon} ${subject} · ${year}</h2><p class="sub">Add the topics you're studying, then click one to add lessons.</p>
    <form class="add-row" id="addForm">
      <input type="text" id="newName" placeholder="New topic, e.g. Algebra" maxlength="80">
      <button class="btn" type="submit">+ Add topic</button>
    </form>
    <div class="grid" id="grid"></div>`;
  const grid = app.querySelector("#grid");
  if (!topics.length) grid.outerHTML = `<div class="empty">No topics yet — add your first one above.</div>`;
  topics.forEach(t => {
    const cards = t.lessons.reduce((n, l) => n + l.cards.length, 0);
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = `<div class="stripe" style="background:${s.color}"></div>
      <div class="actions"></div>
      <div class="name">${esc(t.name)}</div>
      <div class="meta">${plural(t.lessons.length, "lesson")} · ${plural(cards, "flashcard")}</div>`;
    tile.querySelector(".actions").append(...editButtons(t, "topic", () => {
      topics.splice(topics.indexOf(t), 1);
    }));
    tile.onclick = () => go(subject, year, t.id);
    grid.append(tile);
  });
  app.querySelector("#addForm").onsubmit = e => {
    e.preventDefault();
    const name = app.querySelector("#newName").value.trim();
    if (!name) return;
    topics.push({ id: uid(), name, lessons: [] });
    save();
    render();
    app.querySelector("#newName").focus();
  };
}

function renderLessons(subject, year, topic) {
  const s = subjectInfo(subject);
  setCrumbs([{ label: "Subjects", go: [] }, { label: subject, go: [subject] }, { label: year, go: [subject, year] }, { label: topic.name }]);
  const allCards = topic.lessons.flatMap(l => l.cards);
  const allMistakes = topic.lessons.flatMap(l => l.mistakes);
  app.innerHTML = `<h2>${esc(topic.name)}</h2><p class="sub">${subject} · ${year}</p>
    <div class="toolbar">
      <button class="btn good" id="reviseTopic">🧠 Revise whole topic (${allCards.length} cards)</button>
      <label class="check"><input type="checkbox" id="incMistakes"> Include things I got wrong (${allMistakes.length})</label>
    </div>
    <form class="add-row" id="addForm">
      <input type="text" id="newName" placeholder="New lesson, e.g. Lesson 1 – Expanding brackets" maxlength="100">
      <button class="btn" type="submit">+ Add lesson</button>
    </form>
    <div class="grid" id="grid"></div>`;
  const grid = app.querySelector("#grid");
  if (!topic.lessons.length) grid.outerHTML = `<div class="empty">No lessons yet — add one above.</div>`;
  topic.lessons.forEach(l => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = `<div class="stripe" style="background:${s.color}"></div>
      <div class="actions"></div>
      <div class="name">${esc(l.name)}</div>
      <div class="meta">${plural(l.mistakes.length, "mistake")} · ${plural(l.cards.length, "flashcard")}</div>`;
    tile.querySelector(".actions").append(...editButtons(l, "lesson", () => {
      topic.lessons.splice(topic.lessons.indexOf(l), 1);
    }));
    tile.onclick = () => go(subject, year, topic.id, l.id);
    grid.append(tile);
  });
  app.querySelector("#addForm").onsubmit = e => {
    e.preventDefault();
    const name = app.querySelector("#newName").value.trim();
    if (!name) return;
    topic.lessons.push({ id: uid(), name, mistakes: [], cards: [] });
    save();
    render();
    app.querySelector("#newName").focus();
  };
  app.querySelector("#reviseTopic").onclick = () =>
    startRevise(topic.name, topic.lessons, app.querySelector("#incMistakes").checked);
}

function renderLesson(subject, year, topic, lesson) {
  setCrumbs([{ label: "Subjects", go: [] }, { label: subject, go: [subject] }, { label: year, go: [subject, year] },
    { label: topic.name, go: [subject, year, topic.id] }, { label: lesson.name }]);
  app.innerHTML = `<h2>${esc(lesson.name)}</h2><p class="sub">${subject} · ${year} · ${esc(topic.name)}</p>
    <div class="tabs">
      <button class="tab" data-tab="mistakes">❌ Things I got wrong (${lesson.mistakes.length})</button>
      <button class="tab" data-tab="cards">🗂️ Flashcards (${lesson.cards.length})</button>
      <button class="tab" data-tab="revise">🧠 Revise</button>
    </div>
    <div id="tabBody"></div>`;
  app.querySelectorAll(".tab").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === lessonTab);
    b.onclick = () => { lessonTab = b.dataset.tab; render(); };
  });
  const body = app.querySelector("#tabBody");
  if (lessonTab === "mistakes") renderMistakes(body, lesson);
  else if (lessonTab === "cards") renderCards(body, lesson);
  else renderReviseTab(body, lesson);
}

function renderMistakes(body, lesson) {
  body.innerHTML = `<form class="panel" id="form">
      <div class="form-grid">
        <div><label>What I got wrong</label><textarea id="wrong" placeholder="e.g. I wrote 3² = 6"></textarea></div>
        <div><label>The correct answer / how to fix it</label><textarea id="right" placeholder="e.g. 3² = 3 × 3 = 9"></textarea></div>
      </div>
      <div style="margin-top:10px"><button class="btn" type="submit">+ Add mistake</button></div>
    </form>
    <div id="list"></div>`;
  const list = body.querySelector("#list");
  if (!lesson.mistakes.length) list.innerHTML = `<div class="empty">Nothing here yet. Add anything you got wrong in this lesson so you can learn from it.</div>`;
  lesson.mistakes.forEach(m => list.append(mistakeItem(m, lesson.mistakes)));
  body.querySelector("#form").onsubmit = e => {
    e.preventDefault();
    const wrong = body.querySelector("#wrong").value.trim();
    const right = body.querySelector("#right").value.trim();
    if (!wrong) return body.querySelector("#wrong").focus();
    lesson.mistakes.push({ id: uid(), wrong, right });
    save(); render();
    app.querySelector("#wrong").focus();
  };
}

function renderHomework(subject) {
  const s = subjectInfo(subject);
  const mistakes = homeworkFor(subject);
  setCrumbs([{ label: "Subjects", go: [] }, { label: subject, go: [subject] }, { label: "Homework mistakes" }]);
  const names = [...new Set(mistakes.map(m => m.hw).filter(Boolean))];
  app.innerHTML = `<h2>📝 Homework mistakes</h2><p class="sub">${s.icon} ${subject} — everything you got wrong in your homework.</p>
    <div class="toolbar">
      <button class="btn good" id="revise">🧠 Revise homework mistakes (${mistakes.length})</button>
    </div>
    <form class="panel" id="form">
      <label class="check" style="margin-bottom:4px">Which homework?</label>
      <input type="text" id="hw" list="hwNames" placeholder="e.g. Homework 3 – Fractions" maxlength="100" style="width:100%;margin-bottom:10px">
      <datalist id="hwNames">${names.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
      <div class="form-grid">
        <div><label>What I got wrong</label><textarea id="wrong" placeholder="e.g. I forgot to simplify 4/8"></textarea></div>
        <div><label>The correct answer / how to fix it</label><textarea id="right" placeholder="e.g. 4/8 = 1/2"></textarea></div>
      </div>
      <div style="margin-top:10px"><button class="btn" type="submit">+ Add mistake</button></div>
    </form>
    <div id="list"></div>`;
  const list = app.querySelector("#list");
  if (!mistakes.length) list.innerHTML = `<div class="empty">No homework mistakes yet. Add anything you got wrong in your homework above.</div>`;
  // Group by homework name, newest homework first
  const groups = new Map();
  mistakes.slice().reverse().forEach(m => {
    const key = m.hw || "Other homework";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).unshift(m);
  });
  groups.forEach((items, name) => {
    const h = document.createElement("h3");
    h.style.margin = "18px 0 8px";
    h.textContent = `${name} (${items.length})`;
    list.append(h, ...items.map(m => mistakeItem(m, mistakes)));
  });
  app.querySelector("#form").onsubmit = e => {
    e.preventDefault();
    const hw = app.querySelector("#hw").value.trim();
    const wrong = app.querySelector("#wrong").value.trim();
    const right = app.querySelector("#right").value.trim();
    if (!wrong) return app.querySelector("#wrong").focus();
    mistakes.push({ id: uid(), hw, wrong, right });
    save(); render();
    // Keep the homework name filled in so several mistakes can be added in a row
    app.querySelector("#hw").value = hw;
    app.querySelector("#wrong").focus();
  };
  app.querySelector("#revise").onclick = () =>
    startRevise("Homework mistakes", [{ cards: [], mistakes }], true);
}

function renderCards(body, lesson) {
  body.innerHTML = `<form class="panel" id="form">
      <div class="form-grid">
        <div><label>Front (question)</label><textarea id="q" placeholder="e.g. What is the formula for the area of a circle?"></textarea></div>
        <div><label>Back (answer)</label><textarea id="a" placeholder="e.g. A = πr²"></textarea></div>
      </div>
      <div style="margin-top:10px"><button class="btn" type="submit">+ Add flashcard</button></div>
    </form>
    <div id="list"></div>`;
  const list = body.querySelector("#list");
  if (!lesson.cards.length) list.innerHTML = `<div class="empty">No flashcards yet. Type a question and answer above.</div>`;
  lesson.cards.forEach(c => {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<div class="body">
        <div class="label">Front ${c.known ? '<span class="badge known">✓ known</span>' : ""}</div><div>${esc(c.q)}</div>
        <div class="label" style="margin-top:8px">Back</div><div>${esc(c.a)}</div>
      </div>`;
    const edit = iconButton("✏️", "Edit", () => {
      const q = prompt("Front (question):", c.q);
      if (q === null || !q.trim()) return;
      const a = prompt("Back (answer):", c.a);
      if (a === null) return;
      c.q = q.trim(); c.a = a.trim();
      save(); render();
    });
    const del = iconButton("🗑️", "Delete", () => {
      if (!confirm("Delete this flashcard?")) return;
      lesson.cards.splice(lesson.cards.indexOf(c), 1);
      save(); render();
    });
    el.append(edit, del);
    list.append(el);
  });
  body.querySelector("#form").onsubmit = e => {
    e.preventDefault();
    const q = body.querySelector("#q").value.trim();
    const a = body.querySelector("#a").value.trim();
    if (!q) return body.querySelector("#q").focus();
    lesson.cards.push({ id: uid(), q, a, known: false });
    save(); render();
    app.querySelector("#q").focus();
  };
}

function renderReviseTab(body, lesson) {
  const known = lesson.cards.filter(c => c.known).length;
  body.innerHTML = `<div class="panel">
      <p style="margin-top:0">You have <b>${plural(lesson.cards.length, "flashcard")}</b> (${known} marked as known)
      and <b>${plural(lesson.mistakes.length, "mistake")}</b> in this lesson.</p>
      <p class="hint">Cards are shuffled. Click a card to flip it, then say whether you got it right.</p>
      <div class="toolbar">
        <label class="check"><input type="checkbox" id="incMistakes" checked> Include things I got wrong</label>
        <label class="check"><input type="checkbox" id="onlyUnknown"> Only cards I don't know yet</label>
      </div>
      <button class="btn good" id="go">Start revising</button>
    </div>`;
  body.querySelector("#go").onclick = () =>
    startRevise(lesson.name, [lesson], body.querySelector("#incMistakes").checked, body.querySelector("#onlyUnknown").checked);
}

// ---------- Shared bits ----------
function iconButton(symbol, title, onClick) {
  const b = document.createElement("button");
  b.className = "icon-btn";
  b.type = "button";
  b.title = title;
  b.textContent = symbol;
  b.onclick = e => { e.stopPropagation(); onClick(); };
  return b;
}
function mistakeItem(m, owner) {
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `<div class="body">
      <div class="label wrong">Got wrong</div><div>${esc(m.wrong)}</div>
      ${m.right ? `<div class="label right" style="margin-top:8px">Correct</div><div>${esc(m.right)}</div>` : ""}
    </div>`;
  const edit = iconButton("✏️", "Edit", () => {
    const wrong = prompt("What you got wrong:", m.wrong);
    if (wrong === null || !wrong.trim()) return;
    const right = prompt("The correct answer:", m.right);
    if (right === null) return;
    m.wrong = wrong.trim(); m.right = right.trim();
    save(); render();
  });
  const del = iconButton("🗑️", "Delete", () => {
    if (!confirm("Delete this mistake?")) return;
    owner.splice(owner.indexOf(m), 1);
    save(); render();
  });
  el.append(edit, del);
  return el;
}
function editButtons(obj, kind, remove) {
  return [
    iconButton("✏️", "Rename", () => {
      const name = prompt(`Rename ${kind}:`, obj.name);
      if (name && name.trim()) { obj.name = name.trim(); save(); render(); }
    }),
    iconButton("🗑️", "Delete", () => {
      if (!confirm(`Delete the ${kind} "${obj.name}" and everything in it?`)) return;
      remove(); save(); render();
    }),
  ];
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ---------- Revise mode ----------
let overlay = null;

function startRevise(title, lessons, includeMistakes, onlyUnknown = false) {
  let deck = [];
  lessons.forEach(l => {
    l.cards.forEach(c => { if (!onlyUnknown || !c.known) deck.push({ kind: "card", front: c.q, back: c.a, ref: c }); });
    if (includeMistakes) l.mistakes.forEach(m => deck.push({
      kind: "mistake", front: m.wrong, back: m.right || "(no correction written yet)", ref: null,
    }));
  });
  if (!deck.length) {
    alert(onlyUnknown ? "You know all of these cards already — nice! Untick 'Only cards I don't know yet' to go again."
                      : "There's nothing to revise yet. Add some flashcards first!");
    return;
  }
  runDeck(title, shuffle(deck));
}

function runDeck(title, deck) {
  closeRevise();
  overlay = document.createElement("div");
  overlay.className = "overlay";
  document.body.append(overlay);
  document.body.style.overflow = "hidden";
  let i = 0;
  const missed = [];
  let flipped = false;

  function show() {
    if (i >= deck.length) return finish();
    const card = deck[i];
    flipped = false;
    const frontTag = card.kind === "mistake" ? "❌ What I got wrong — what's the right answer?" : "Question";
    const backTag = card.kind === "mistake" ? "✅ Correct answer" : "Answer";
    overlay.innerHTML = `
      <div class="top"><b>🧠 ${esc(title)}</b><button class="btn secondary" id="exit">✕ Exit</button></div>
      <div class="progress"><div style="width:${(i / deck.length) * 100}%"></div></div>
      <div class="hint">Card ${i + 1} of ${deck.length}</div>
      <div class="flashcard" id="fc">
        <div class="inner">
          <div class="face"><span class="tag">${frontTag}</span>${esc(card.front)}</div>
          <div class="face back"><span class="tag">${backTag}</span>${esc(card.back)}</div>
        </div>
      </div>
      <div class="hint" id="hint">Click the card (or press Space) to flip it</div>
      <div class="answer-btns" id="btns" style="visibility:hidden">
        <button class="btn danger" id="no">✗ Still learning</button>
        <button class="btn good" id="yes">✓ Got it</button>
      </div>`;
    overlay.querySelector("#exit").onclick = () => closeRevise();
    overlay.querySelector("#fc").onclick = flip;
    overlay.querySelector("#yes").onclick = () => answer(true);
    overlay.querySelector("#no").onclick = () => answer(false);
  }
  function flip() {
    flipped = !flipped;
    overlay.querySelector("#fc").classList.toggle("flipped", flipped);
    overlay.querySelector("#btns").style.visibility = "visible";
    overlay.querySelector("#hint").textContent = "Did you get it right? (← still learning · → got it)";
  }
  function answer(gotIt) {
    const card = deck[i];
    if (card.ref) card.ref.known = gotIt;
    if (!gotIt) missed.push(card);
    save();
    i++;
    show();
  }
  function finish() {
    const score = deck.length - missed.length;
    const pct = Math.round((score / deck.length) * 100);
    const msg = pct === 100 ? "Perfect! 🎉" : pct >= 70 ? "Great work! 💪" : pct >= 40 ? "Good effort — keep going! 📈" : "Keep practising — you'll get there! 🌱";
    overlay.innerHTML = `
      <div class="result">
        <div class="big">${score} / ${deck.length}</div>
        <p style="font-size:1.2rem">${msg}</p>
        <div class="answer-btns" style="justify-content:center;flex-wrap:wrap">
          ${missed.length ? `<button class="btn" id="again">🔁 Revise the ${missed.length} I missed</button>` : ""}
          <button class="btn secondary" id="all">Start over</button>
          <button class="btn secondary" id="done">Done</button>
        </div>
      </div>`;
    if (missed.length) overlay.querySelector("#again").onclick = () => runDeck(title, shuffle(missed.slice()));
    overlay.querySelector("#all").onclick = () => runDeck(title, shuffle(deck.slice()));
    overlay.querySelector("#done").onclick = () => { closeRevise(); render(); };
  }

  overlay.keyHandler = e => {
    if (e.key === "Escape") return closeRevise();
    if (i >= deck.length) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
    else if (flipped && e.key === "ArrowRight") answer(true);
    else if (flipped && e.key === "ArrowLeft") answer(false);
  };
  document.addEventListener("keydown", overlay.keyHandler);
  show();
}

function closeRevise() {
  if (!overlay) return;
  document.removeEventListener("keydown", overlay.keyHandler);
  overlay.remove();
  overlay = null;
  document.body.style.overflow = "";
}

// ---------- Back up / restore ----------
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "lesson-revision-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  file.text().then(text => {
    try {
      const parsed = JSON.parse(text);
      if (typeof parsed !== "object" || !parsed) throw new Error();
      if (!confirm("Restoring will replace everything currently saved. Continue?")) return;
      data = parsed;
      save();
      go();
      render();
    } catch {
      alert("That file doesn't look like a Lesson Revision backup.");
    }
  });
  e.target.value = "";
};

render();
</script>
