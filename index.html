<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson Revision</title>
<!-- Lets the page be installed as an app on a phone (home screen icon, opens full screen) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f6bed">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revision">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #667085;
    --border: #e2e6ef;
    --accent: #4f6bed;
    --danger: #d64545;
    --good: #2e9e5b;
    --confident: #2a78d6;
    --improving: #eb6834;
    --sea: #cfe3fb;
    --hit: #f6c4c4;
    --miss: #eef1f6;
    --shadow: 0 2px 8px rgba(20, 30, 60, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1c212b;
      --text: #e8ebf2;
      --muted: #9aa3b5;
      --border: #2c3340;
      --confident: #3987e5;
      --improving: #d95926;
      --sea: #1d3a5c;
      --hit: #6b2a2e;
      --miss: #2a303b;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { margin: 0; font-size: 1.25rem; cursor: pointer; display: inline-block; }
  .crumbs { font-size: 0.9rem; color: var(--muted); margin-top: 4px; }
  .crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .crumbs a:hover { text-decoration: underline; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
  h2 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }
  .tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    cursor: pointer;
    position: relative;
    transition: transform 0.1s, border-color 0.1s;
  }
  .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
  .tile .icon { font-size: 2rem; }
  .tile .name { font-weight: 600; font-size: 1.1rem; margin-top: 6px; word-break: break-word; }
  .tile .meta { color: var(--muted); font-size: 0.85rem; }
  .tile .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 14px 0 0 14px; }
  .tile .actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .icon-btn {
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 0.95rem; padding: 4px 6px; border-radius: 6px;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  .add-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  input[type=text], input[type=date], textarea {
    flex: 1; min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font: inherit;
  }
  textarea { resize: vertical; min-height: 60px; width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.btn {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn.secondary { background: var(--border); color: var(--text); }
  button.btn.good { background: var(--good); }
  button.btn.danger { background: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; border: 2px dashed var(--border); border-radius: 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font: inherit;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
  }
  .item .body { flex: 1; min-width: 0; word-break: break-word; }
  .item .body > div { white-space: pre-wrap; }
  .item .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .wrong { color: var(--danger); }
  .right { color: var(--good); }
  .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .badge.known { background: rgba(46, 158, 91, 0.15); color: var(--good); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .toolbar .spacer { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; }

  /* Revise mode */
  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 20;
    display: flex; flex-direction: column; align-items: center; padding: 20px 16px; overflow-y: auto;
    padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .ov-timer { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; margin-left: auto; margin-right: 12px; }
  .card-clock { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--confident); }
  .card-clock.slow { color: var(--improving); }
  .overlay .top { width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .progress { width: 100%; max-width: 640px; height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .progress div { height: 100%; background: var(--accent); transition: width 0.2s; }
  .flashcard { width: 100%; max-width: 640px; height: 320px; perspective: 1200px; cursor: pointer; }
  .flashcard .inner { position: relative; width: 100%; height: 100%; transition: transform 0.45s; transform-style: preserve-3d; }
  .flashcard.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; font-size: 1.3rem; white-space: pre-wrap; word-break: break-word; overflow-y: auto;
  }
  .face .tag { position: absolute; top: 12px; left: 16px; font-size: 0.8rem; color: var(--muted); }
  .face.back { transform: rotateY(180deg); border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 12px 0; }
  .answer-btns { display: flex; gap: 12px; margin-top: 8px; }
  .result { text-align: center; max-width: 500px; margin-top: 40px; }
  .result .big { font-size: 3rem; font-weight: 700; }

  /* Streak & study time */
  .hdr-stats { float: right; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 3px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .stat .k { font-size: 0.85rem; color: var(--muted); }
  .stat .v { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat .s { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
  .meter { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .meter div { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s; }
  .week { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 28px; }
  .week .bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; border-bottom: 1px solid var(--border); position: relative; }
  .week .col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; cursor: default; }
  .week .bar { width: 100%; max-width: 36px; background: var(--accent); opacity: 0.5; border-radius: 4px 4px 0 0; min-height: 2px; }
  .week .col.today .bar { opacity: 1; }
  .week .col:hover .bar { opacity: 0.85; }
  .week .target { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--muted); pointer-events: none; }
  .week .target span { position: absolute; left: 0; bottom: 2px; font-size: 0.75rem; color: var(--muted); background: var(--card); padding: 0 4px; border-radius: 4px; }
  .week .col.stack { flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; }
  .week .seg { width: 100%; max-width: 36px; }
  .week .seg:first-child { border-radius: 4px 4px 0 0; }
  .week .col.stack:hover .seg { filter: brightness(1.1); }
  .legend { display: flex; gap: 12px; font-size: 0.8rem; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .badge.level-confident { background: rgba(42, 120, 214, 0.15); color: var(--text); }
  .badge.level-improving { background: rgba(235, 104, 52, 0.15); color: var(--text); }
  .week .labels { display: flex; gap: 8px; margin-top: 6px; }
  .week .labels span { flex: 1; text-align: center; font-size: 0.8rem; color: var(--muted); }
  .week .labels span.today { color: var(--text); font-weight: 600; }
  .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; z-index: 30; display: none; white-space: nowrap; }

  /* Games */
  .game { width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .status { min-height: 46px; text-align: center; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; }
  .qmodal { position: fixed; inset: 0; background: rgba(10, 15, 30, 0.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 25; }
  .qcard { background: var(--card); border-radius: 18px; padding: 20px; width: 100%; max-width: 520px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); text-align: center; max-height: 90vh; overflow-y: auto; }
  .qtag { font-size: 0.8rem; color: var(--muted); }
  .game-result { width: 100%; display: flex; justify-content: center; }
  .game-result .qcard { box-shadow: var(--shadow); border: 2px solid var(--accent); padding: 14px; }
  .qfront { font-size: 1.3rem; white-space: pre-wrap; word-break: break-word; margin: 12px 0; }
  .qback { font-size: 1.15rem; white-space: pre-wrap; word-break: break-word; border-top: 1px solid var(--border); padding-top: 12px; margin-bottom: 8px; }
  .sl-board { display: grid; grid-template-columns: repeat(10, 1fr); width: 100%; max-width: 520px; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .sl-cell { position: relative; background: var(--card); font-size: 0.6rem; color: var(--muted); padding: 2px 3px; display: flex; flex-direction: column; line-height: 1.1; overflow: hidden; }
  .sl-cell.alt { background: var(--bg); }
  .sl-cell .mark { font-size: 0.85rem; }
  .sl-cell .mark small { font-size: 0.55rem; color: var(--muted); }
  @media (max-width: 480px) { .sl-cell .mark small { display: none; } }
  .sl-cell .tokens { position: absolute; right: 1px; bottom: 0; font-size: clamp(0.8rem, 3.2vw, 1.25rem); }
  .ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(330px, 90%); aspect-ratio: 1; }
  .ttt button { font-size: 2.6rem; background: var(--card); border: 2px solid var(--border); border-radius: 14px; cursor: pointer; color: var(--text); }
  .ttt button:not(:disabled):hover { border-color: var(--accent); }
  .ttt button.win { background: rgba(46, 158, 91, 0.2); border-color: var(--good); }
  .c4 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 8px; background: var(--accent); border-radius: 14px; width: min(460px, 100%); }
  .c4 .slot { aspect-ratio: 1; border-radius: 50%; background: var(--bg); cursor: pointer; }
  .c4 .slot.you { background: #e5484d; }
  .c4 .slot.cpu { background: #f5c400; }
  .c4 .slot.win { box-shadow: 0 0 0 4px #fff inset; }
  .bs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; width: min(400px, 100%); }
  .bs.small { width: min(240px, 65%); }
  .bs .sq { aspect-ratio: 1; background: var(--sea); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: clamp(0.7rem, 3vw, 1.1rem); color: var(--muted); }
  .bs .sq.open { cursor: pointer; }
  .bs .sq.open:hover { outline: 2px solid var(--accent); }
  .bs .sq.ship { background: var(--muted); }
  .bs .sq.hit { background: var(--hit); }
  .bs .sq.sunk { background: #d64545; }
  .bs .sq.miss { background: var(--miss); }
  .bs .sq.last { box-shadow: 0 0 0 3px #f5c400 inset; }
  .bs-key { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 0.85rem; color: var(--muted); }
  .bs-key > span { display: flex; align-items: center; gap: 5px; }
  .bs-key .sq { width: 22px; height: 22px; border-radius: 4px; background: var(--sea); display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; }
  .bs-key .sq.ship { background: var(--muted); }
  .bs-key .sq.hit { background: var(--hit); }
  .bs-key .sq.sunk { background: #d64545; }
  .bs-key .sq.miss { background: var(--miss); }
  .bs-key .sq.last { box-shadow: 0 0 0 3px #f5c400 inset; }

  footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 10px 16px 30px; }
  footer button { margin: 4px; }
</style>
</head>
<body>
<header>
  <span class="hdr-stats" id="hdrStats" title="Your streak and time studied today. ⏸️ = paused: the timer only runs on notes, mistakes, flashcards and while revising."></span>
  <h1 id="home">📚 Lesson Revision</h1>
  <div class="crumbs" id="crumbs"></div>
</header>
<main id="app"></main>
<footer>
  Your work is saved in this browser automatically.
  <div>
    <button class="btn secondary" id="exportBtn">⬇ Back up</button>
    <button class="btn secondary" id="importBtn">⬆ Restore</button>
    <button class="btn" id="installBtn" hidden>📲 Install app</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</footer>

<script>
const SUBJECTS = [
  { name: "Maths",     icon: "➗", color: "#4f6bed" },
  { name: "English",   icon: "📖", color: "#c2410c" },
  { name: "Science",   icon: "🔬", color: "#2e9e5b" },
  { name: "Spanish",   icon: "🇪🇸", color: "#d6a100" },
  { name: "Geography", icon: "🌍", color: "#0e9bb0" },
  { name: "History",   icon: "🏛️", color: "#8b5cf6" },
];
const YEARS = ["Year 7", "Year 8", "Year 9", "Year 10", "Year 11", "Year 12", "Year 13"];
const STORAGE_KEY = "lessonRevisionData.v1";

// ---------- Data ----------
// data[subject][year] = [ { id, name, notes: [{id, text}], mistakes: [{id, wrong, right, ...}], cards: [{id, q, a, ...}], links: [...] } ]
let data = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) {}
  return {};
}
// Earlier versions split each topic into lessons: move every lesson's notes, mistakes and flashcards into its topic
function migrate(d) {
  SUBJECTS.forEach(s => Object.values(d[s.name] || {}).forEach(topics => topics.forEach(t => {
    ["notes", "mistakes", "cards"].forEach(k => {
      t[k] = (t[k] || []).concat(...(t.lessons || []).map(l => l[k] || []));
    });
    delete t.lessons;
  })));
  return d;
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { alert("Couldn't save — your browser storage may be full or blocked. Use 'Back up' to keep a copy."); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function topicsFor(subject, year) {
  data[subject] = data[subject] || {};
  data[subject][year] = data[subject][year] || [];
  return data[subject][year];
}
// Homework mistakes live apart from topics, one list per subject: data.homework["Maths"] = [{id, hw, wrong, right}]
function homeworkFor(subject) {
  data.homework = data.homework || {};
  // Merge any lists saved per year by an earlier version ("Maths|Year 9") into the subject's list
  Object.keys(data.homework).forEach(key => {
    if (key.startsWith(subject + "|")) {
      data.homework[subject] = (data.homework[subject] || []).concat(data.homework[key]);
      delete data.homework[key];
    }
  });
  data.homework[subject] = data.homework[subject] || [];
  return data.homework[subject];
}
function subjectInfo(name) { return SUBJECTS.find(s => s.name === name) || SUBJECTS[0]; }
function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

// ---------- Routing (uses the URL hash so the back button works) ----------
function go(...parts) { location.hash = parts.map(encodeURIComponent).join("/"); }
function route() { return location.hash.slice(1).split("/").filter(Boolean).map(decodeURIComponent); }
window.addEventListener("hashchange", () => { editingId = null; render(); });
document.getElementById("home").onclick = () => go();

const app = document.getElementById("app");
let topicTab = "notes";

function render() {
  const [subject, year, topicId] = route();
  closeRevise();
  if (!subject || !SUBJECTS.some(s => s.name === subject)) return renderSubjects();
  if (!year) return renderYears(subject);
  if (year === "homework") return renderHomework(subject);
  const topic = topicsFor(subject, year).find(t => t.id === topicId);
  if (!topic) return renderTopics(subject, year);
  renderTopic(subject, year, topic);
}

function setCrumbs(items) {
  const el = document.getElementById("crumbs");
  el.innerHTML = "";
  items.forEach((item, i) => {
    if (i > 0) el.append(" › ");
    if (item.go) {
      const a = document.createElement("a");
      a.textContent = item.label;
      a.onclick = () => go(...item.go);
      el.append(a);
    } else {
      el.append(item.label);
    }
  });
}

// ---------- Screens ----------
function renderSubjects() {
  setCrumbs([{ label: "Subjects" }]);
  app.innerHTML = `<div id="statsBox"></div>
    <h2>Choose a subject</h2><p class="sub">Pick a lesson subject to start revising.</p><div class="grid" id="grid"></div>`;
  renderStats(app.querySelector("#statsBox"));
  const grid = app.querySelector("#grid");
  SUBJECTS.forEach(s => {
    const years = data[s.name] || {};
    const topicCount = Object.values(years).reduce((n, t) => n + t.length, 0);
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = `<div class="stripe" style="background:${s.color}"></div>
      <div class="icon">${s.icon}</div><div class="name">${s.name}</div>
      <div class="meta">${plural(topicCount, "topic")}</div>`;
    tile.onclick = () => go(s.name);
    grid.append(tile);
  });
}

function renderYears(subject) {
  const s = subjectInfo(subject);
  setCrumbs([{ label: "Subjects", go: [] }, { label: subject }]);
  const homework = homeworkFor(subject);
  app.innerHTML = `<h2>${s.icon} ${subject}</h2>
    <div class="grid" style="margin-bottom:24px">
      <div class="tile" id="homeworkTile">
        <div class="stripe" style="background:var(--danger)"></div>
        <div class="icon">📝</div><div class="name">Homework mistakes</div>
        <div class="meta">${plural(homework.length, "mistake")}</div>
      </div>
    </div>
    <p class="sub">Which school year are you in?</p><div class="grid" id="grid"></div>`;
  app.querySelector("#homeworkTile").onclick = () => go(subject, "homework");
  const grid = app.querySelector("#grid");
  YEARS.forEach(y => {
    const topics = (data[subject] && data[subject][y]) || [];
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = `<div class="stripe" style="background:${s.color}"></div>
      <div class="name">${y}</div><div class="meta">${plural(topics.length, "topic")}</div>`;
    tile.onclick = () => go(subject, y);

// ---------- Useful links (one list per topic) ----------
// Only web links are allowed, so a saved link can never run code when clicked
function cleanUrl(raw) {
  let u = raw.trim();
  if (!u) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u;
  try {
    const parsed = new URL(u);
    return /^https?:$/.test(parsed.protocol) ? parsed.href : null;
  } catch { return null; }
}

// ---------- Notes ----------
// Turns a note into a flashcard. "Word: meaning", "Word - meaning", "x = y", "A → B",
// "X means Y" and "X is Y" become question/answer; anything else becomes fill-in-the-blank.
function noteToCard(text) {
  const t = text.trim();
  const rules = [
    { re: /^(.{1,80}?)\s*:\s+([\s\S]+)$/,             q: m => m[1] },
    { re: /^(.{1,80}?)\s+[-–—]\s+([\s\S]+)$/,         q: m => m[1] },
    { re: /^(.{1,80}?)\s*(?:→|->|=>)\s*([\s\S]+)$/,   q: m => m[1] },
    { re: /^(.{1,80}?)\s+means\s+([\s\S]+)$/i,        q: m => `What does "${m[1]}" mean?` },
    { re: /^(.{1,80}?)\s*=\s*([\s\S]+)$/,             q: m => `${m[1]} = ?` },
    { re: /^(.{1,60}?)\s+(is|are)\s+([\s\S]+)$/i,     q: m => `What ${m[2].toLowerCase()} ${m[1]}?`, a: m => m[3] },
  ];
  for (const r of rules) {
    const m = t.match(r.re);
    if (!m) continue;
    const q = r.q(m).trim(), a = (r.a ? r.a(m) : m[2]).trim();
    if (q && a) return { q, a };
  }
  // Fill in the blank: hide the longest word
  const words = t.match(/[A-Za-zÀ-ÿ']{4,}/g);
  if (!words) return null;
  const word = words.reduce((a, b) => (b.length > a.length ? b : a));
  return { q: "Fill in the blank:\n" + t.replace(word, "_____"), a: word + "\n\n" + t };
}
// Adds or updates the topic flashcard linked to a note or mistake (source = "fromNote" / "fromMistake")
function syncCard(topic, source, id, made) {
  if (!made) return false;
  const card = topic.cards.find(c => c[source] === id);
  if (card) {
    if (card.q !== made.q || card.a !== made.a) Object.assign(card, made, { known: false, level: null });
  } else {
    topic.cards.push({ id: uid(), q: made.q, a: made.a, known: false, [source]: id });
  }
  return true;
}
function syncNoteCard(topic, note) {
  return syncCard(topic, "fromNote", note.id, noteToCard(note.text));
}
function mistakeToCard(m) {
  return {
    q: `❌ I got this wrong:\n${m.wrong}\n\nWhat's the right answer${m.how ? " – and how do you work it out" : ""}?`,
    a: (m.right || "(no correct answer written yet)") + (m.how ? "\n\nHow to work it out:\n" + m.how : ""),
  };
}
function syncMistakeCard(topic, m) {
  return syncCard(topic, "fromMistake", m.id, mistakeToCard(m));
}

function renderNotes(body, topic) {
  const editing = topic.notes.find(n => n.id === editingId);
  const missing = topic.notes.filter(n => !topic.cards.some(c => c.fromNote === n.id)).length;
  body.innerHTML = `<form class="panel" id="form">
      <label class="check" style="margin-bottom:4px">${editing ? "Edit note" : "Key note"}</label>
      <textarea id="text" placeholder="e.g. Photosynthesis: plants use light to turn CO₂ and water into glucose and oxygen"></textarea>
      <p class="hint" style="margin:6px 0">💡 Tip: write notes like <b>Word: what it means</b> or <b>Word - what it means</b> to get the best flashcards.
        Other notes become fill-in-the-blank cards.</p>
      <div class="toolbar" style="margin:0">
        <button class="btn" type="submit">${editing ? "Save changes" : "+ Add note"}</button>
        ${editing ? `<button class="btn secondary" type="button" id="cancel">Cancel</button>` : ""}
        <label class="check"><input type="checkbox" id="auto" checked> Make a flashcard from this note automatically</label>
      </div>
    </form>
    ${missing ? `<div class="toolbar"><button class="btn good" id="makeAll">✨ Make flashcards from ${plural(missing, "note")} without one</button></div>` : ""}
    <div id="list"></div>`;
  const textEl = body.querySelector("#text");
  if (editing) { textEl.value = editing.text; textEl.focus(); }
  const list = body.querySelector("#list");
  if (!topic.notes.length) list.innerHTML = `<div class="empty">No notes yet. Write down the key points from this topic.</div>`;
  topic.notes.forEach(n => {
    const hasCard = topic.cards.some(c => c.fromNote === n.id);
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<div class="body"><div>${esc(n.text)}</div>
      <div style="margin-top:6px">${hasCard ? '<span class="badge known">🗂️ flashcard made</span>' : ""}</div></div>`;
    if (!hasCard) el.append(iconButton("🗂️", "Make flashcard", () => {
      if (!syncNoteCard(topic, n)) return alert("Couldn't make a flashcard from that note — try writing it as 'Word: meaning'.");
      save(); render();
    }));
    el.append(
      iconButton("✏️", "Edit", () => { editingId = n.id; render(); }),
      iconButton("🗑️", "Delete", () => {
        if (!confirm("Delete this note? (Any flashcard made from it stays.)")) return;
        topic.notes.splice(topic.notes.indexOf(n), 1);
        save(); render();
      }));
    list.append(el);
  });
  if (editing) body.querySelector("#cancel").onclick = () => { editingId = null; render(); };
  if (missing) body.querySelector("#makeAll").onclick = () => {
    let made = 0;
    topic.notes.forEach(n => { if (!topic.cards.some(c => c.fromNote === n.id) && syncNoteCard(topic, n)) made++; });
    save(); render();
    alert(`Made ${plural(made, "flashcard")}! Check the Flashcards tab.`);
  };
  body.querySelector("#form").onsubmit = e => {
    e.preventDefault();
    const text = textEl.value.trim();
    if (!text) return textEl.focus();
    let note = editing;
    if (note) note.text = text;
    else topic.notes.push(note = { id: uid(), text });
    // Keep an existing note's flashcard up to date when the note is edited
    if (body.querySelector("#auto").checked || topic.cards.some(c => c.fromNote === note.id)) syncNoteCard(topic, note);
    editingId = null;
    save(); render();
    app.querySelector("#text").focus();
  };
}

// ---------- Mistakes (used by topics and homework) ----------
const CATEGORIES = {
  dontknow: { label: "Didn't know",          icon: "🤔", color: "#d64545" },
  silly:    { label: "Silly mistake",        icon: "🙈", color: "#c98a00" },
  practice: { label: "Needs more practice",  icon: "🔁", color: "#4f6bed" },
};
let editingId = null;
let mistakeFilter = "all";
let lastHomework = "";

function today() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function niceDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function catBadge(cat) {
  const c = CATEGORIES[cat];
  return c ? `<span class="badge" style="background:${c.color}22;color:${c.color}">${c.icon} ${c.label}</span>` : "";
}

// opts.homework: true to ask which homework and group by it
function renderMistakes(body, mistakes, opts) {
  const editing = mistakes.find(m => m.id === editingId);
  const names = [...new Set(mistakes.map(m => m.hw).filter(Boolean))];
  const counts = { all: mistakes.length };
  Object.keys(CATEGORIES).forEach(k => counts[k] = mistakes.filter(m => m.cat === k).length);
  const hasCard = m => opts.topic && opts.topic.cards.some(c => c.fromMistake === m.id);
  const missing = opts.topic ? mistakes.filter(m => !hasCard(m)).length : 0;
  body.innerHTML = `<form class="panel" id="form">
      ${editing ? `<p style="margin:0 0 10px"><b>✏️ Editing mistake</b></p>` : ""}
      <div class="form-grid">
        ${opts.homework ? `<div><label>Which homework?</label>
          <input type="text" id="hw" list="hwNames" placeholder="e.g. Homework 3 – Fractions" maxlength="100" style="width:100%">
          <datalist id="hwNames">${names.map(n => `<option value="${esc(n)}">`).join("")}</datalist></div>` : ""}
        <div><label>Day I made the mistake</label><input type="date" id="date" style="width:100%"></div>
      </div>
      <label class="check" style="margin:12px 0 6px">What kind of mistake was it?</label>
      <div class="tabs" id="cats" style="margin-bottom:12px">
        ${Object.entries(CATEGORIES).map(([k, c]) => `<button type="button" class="tab" data-cat="${k}">${c.icon} ${c.label}</button>`).join("")}
      </div>
      <div class="form-grid">
        <div><label>What I got wrong</label><textarea id="wrong" placeholder="e.g. I wrote 3² = 6"></textarea></div>
        <div><label>The correct answer</label><textarea id="right" placeholder="e.g. 9"></textarea></div>
      </div>
      <div style="margin-top:10px"><label class="check" style="margin-bottom:4px">🤔 How do I work it out? (write the steps so you know how to do it next time)</label>
        <textarea id="how" placeholder="e.g. Squaring means times the number by itself: 3² = 3 × 3 = 9 (not 3 × 2)"></textarea></div>
      <div class="toolbar" style="margin:10px 0 0">
        <button class="btn" type="submit">${editing ? "Save changes" : "+ Add mistake"}</button>
        ${editing ? `<button class="btn secondary" type="button" id="cancel">Cancel</button>` : ""}
        ${opts.topic ? `<label class="check"><input type="checkbox" id="auto" checked> Make a flashcard from this mistake automatically</label>` : ""}
      </div>
    </form>
    ${missing ? `<div class="toolbar"><button class="btn good" id="makeAll">✨ Make flashcards from ${plural(missing, "mistake")} without one</button></div>` : ""}
    <div class="tabs" id="filters">
      <button class="tab" data-filter="all">All (${counts.all})</button>
      ${Object.entries(CATEGORIES).map(([k, c]) => `<button class="tab" data-filter="${k}">${c.icon} ${c.label} (${counts[k]})</button>`).join("")}
    </div>
    <div id="list"></div>`;

  const $ = sel => body.querySelector(sel);
  let cat = editing ? editing.cat : null;
  const showCat = () => body.querySelectorAll("#cats .tab").forEach(b => b.classList.toggle("active", b.dataset.cat === cat));
  body.querySelectorAll("#cats .tab").forEach(b => b.onclick = () => { cat = cat === b.dataset.cat ? null : b.dataset.cat; showCat(); });
  showCat();
  $("#date").value = editing ? (editing.date || "") : today();
  if (opts.homework) $("#hw").value = editing ? (editing.hw || "") : lastHomework;
  if (editing) {
    $("#wrong").value = editing.wrong; $("#right").value = editing.right || ""; $("#how").value = editing.how || "";
    $("#cancel").onclick = () => { editingId = null; render(); };
    $("#form").scrollIntoView({ block: "start" });
  }

  if (!counts[mistakeFilter] && mistakeFilter !== "all") mistakeFilter = "all";
  body.querySelectorAll("#filters .tab").forEach(b => {
    b.classList.toggle("active", b.dataset.filter === mistakeFilter);
    b.onclick = () => { mistakeFilter = b.dataset.filter; render(); };
  });

  const list = $("#list");
  const shown = mistakes.filter(m => mistakeFilter === "all" || m.cat === mistakeFilter);
  if (!mistakes.length) list.innerHTML = `<div class="empty">${opts.empty}</div>`;
  // Newest first
  const sorted = shown.map((m, i) => [m, i]).sort((a, b) => (b[0].date || "").localeCompare(a[0].date || "") || b[1] - a[1]).map(x => x[0]);
  if (opts.homework) {
    const groups = new Map();
    sorted.forEach(m => {
      const key = m.hw || "Other homework";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(m);
    });
    groups.forEach((items, name) => {
      const h = document.createElement("h3");
      h.style.margin = "18px 0 8px";
      h.textContent = `${name} (${items.length})`;
      list.append(h, ...items.map(m => mistakeItem(m, mistakes)));
    });
  } else {
    sorted.forEach(m => list.append(mistakeItem(m, mistakes, opts.topic)));
  }
  if (missing) $("#makeAll").onclick = () => {
    let made = 0;
    mistakes.forEach(m => { if (!hasCard(m) && syncMistakeCard(opts.topic, m)) made++; });
    save(); render();
    alert(`Made ${plural(made, "flashcard")}! Check the Flashcards tab.`);
  };

  $("#form").onsubmit = e => {
    e.preventDefault();
    const fields = {
      date: $("#date").value,
      cat,
      wrong: $("#wrong").value.trim(),
      right: $("#right").value.trim(),
      how: $("#how").value.trim(),
    };
    if (!fields.wrong) return $("#wrong").focus();
    if (!fields.cat) return alert("Pick what kind of mistake it was: Didn't know, Silly mistake or Needs more practice.");
    if (opts.homework) fields.hw = lastHomework = $("#hw").value.trim();
    let m = editing;
    if (m) Object.assign(m, fields);
    else mistakes.push(m = { id: uid(), ...fields });
    // Keep an existing mistake's flashcard up to date when the mistake is edited
    if (opts.topic && ($("#auto").checked || hasCard(m))) syncMistakeCard(opts.topic, m);
    editingId = null;
    save(); render();
    app.querySelector("#wrong").focus();
  };
}

// topic is given for topic mistakes, which can have a linked flashcard
function mistakeItem(m, owner, topic) {
  const hasCard = topic && topic.cards.some(c => c.fromMistake === m.id);
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `<div class="body">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
        ${m.date ? `<span class="badge">📅 ${niceDate(m.date)}</span>` : ""}${catBadge(m.cat)}
        ${hasCard ? '<span class="badge known">🗂️ flashcard made</span>' : ""}
      </div>
      <div class="label wrong">Got wrong</div><div>${esc(m.wrong)}</div>
      ${m.right ? `<div class="label right" style="margin-top:8px">Correct answer</div><div>${esc(m.right)}</div>` : ""}
      ${m.how ? `<div class="label" style="margin-top:8px">🤔 How to work it out</div><div>${esc(m.how)}</div>`
              : `<div class="hint" style="margin:8px 0 0">⚠️ How do you work it out? Tap ✏️ to add the steps.</div>`}
    </div>`;
  if (topic && !hasCard) el.append(iconButton("🗂️", "Make flashcard", () => {
    syncMistakeCard(topic, m);
    save(); render();
  }));
  el.append(
    iconButton("✏️", "Edit", () => { editingId = m.id; render(); }),
    iconButton("🗑️", "Delete", () => {
      if (!confirm("Delete this mistake? (Any flashcard made from it stays.)")) return;
      owner.splice(owner.indexOf(m), 1);
      save(); render();
    }));
  return el;
}

function renderHomework(subject) {
  const s = subjectInfo(subject);
  const mistakes = homeworkFor(subject);
  setCrumbs([{ label: "Subjects", go: [] }, { label: subject, go: [subject] }, { label: "Homework mistakes" }]);
  app.innerHTML = `<h2>📝 Homework mistakes</h2><p class="sub">${s.icon} ${subject} — everything you got wrong in your homework.</p>

function renderCards(body, topic) {
  body.innerHTML = `<form class="panel" id="form">
      <div class="form-grid">
        <div><label>Front (question)</label><textarea id="q" placeholder="e.g. What is the formula for the area of a circle?"></textarea></div>

    </form>
    <div id="list"></div>`;
  const list = body.querySelector("#list");

  topic.cards.forEach(c => {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<div class="body">
        <div class="label">Front ${levelBadge(c.level)}<span class="badge">${dueText(c)}</span> ${c.fromNote ? '<span class="badge">📒 from notes</span>' : c.fromMistake ? '<span class="badge">❌ from a mistake</span>' : ""}</div><div>${esc(c.q)}</div>
        <div class="label" style="margin-top:8px">Back</div><div>${esc(c.a)}</div>
      </div>`;

      if (a === null) return;
      c.q = q.trim(); c.a = a.trim();
      save(); render();
    });
    const del = iconButton("🗑️", "Delete", () => {
      if (!confirm("Delete this flashcard?")) return;
      topic.cards.splice(topic.cards.indexOf(c), 1);
      save(); render();
    });
    el.append(edit, del);
    list.append(el);
  });
  body.querySelector("#form").onsubmit = e => {
    e.preventDefault();
    const q = body.querySelector("#q").value.trim();
    const a = body.querySelector("#a").value.trim();
    if (!q) return body.querySelector("#q").focus();
    topic.cards.push({ id: uid(), q, a, known: false });
    save(); render();
    app.querySelector("#q").focus();
  };
}

// ---------- Shared bits ----------
function iconButton(symbol, title, onClick) {
  const b = document.createElement("button");
  b.className = "icon-btn";
  b.type = "button";
  b.title = title;
  b.textContent = symbol;
  b.onclick = e => { e.stopPropagation(); onClick(); };
  return b;
}
function editButtons(obj, kind, remove) {
  return [
    iconButton("✏️", "Rename", () => {
      const name = prompt(`Rename ${kind}:`, obj.name);
      if (name && name.trim()) { obj.name = name.trim(); save(); render(); }
    }),
    iconButton("🗑️", "Delete", () => {
      if (!confirm(`Delete the ${kind} "${obj.name}" and everything in it?`)) return;
      remove(); save(); render();
    }),
  ];
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ---------- Revise mode ----------
let overlay = null;

// ---------- Spaced repetition ----------
// Each card (or mistake) keeps srs = { box, due }. Confident moves it up a box so it waits longer
// before coming back; slow moves it down one; wrong sends it back to the start (due again today).
const INTERVALS = [0, 1, 3, 7, 14, 30, 60]; // days to wait in each box
function isDue(item) { return !item.srs || item.srs.due <= today(); }
function schedule(item, level, gotIt, isMistake) {
  const box = item.srs ? item.srs.box : 0;
  const next = !gotIt ? 0 : level === "confident" ? Math.min(box + 1, INTERVALS.length - 1) : Math.max(1, box - 1);
  let days = INTERVALS[next];
  // Mistakes come back twice as often as other cards
  if (isMistake && days > 1) days = Math.ceil(days / 2);
  item.srs = { box: next, due: addDays(today(), days) };
}
// Saves the result of one go at a card (used by revision rounds and the games) and returns its level
function recordAnswer(item, gotIt, thinkSeconds) {
  const level = gotIt && thinkSeconds <= CONFIDENT_SECONDS ? "confident" : "improving";
  if (item.ref) {
    // Only the latest go counts, so a card you used to get wrong becomes confident once you know it well
    Object.assign(item.ref, { known: gotIt, level, lastSeconds: Math.round(thinkSeconds * 10) / 10 });
    logCardResult(item.ref.id, level);
    schedule(item.ref, level, gotIt, item.isMistake);
  }
  save();
  return level;
}
function dueText(item) {
  if (!item.srs) return "🆕 new";
  if (item.srs.due <= today()) return "📅 due today";
  const days = Math.round((Date.parse(item.srs.due) - Date.parse(today())) / 86400000);
  return days === 1 ? "📅 due tomorrow" : `📅 due in ${days} days`;
}

// Everything that could go in a round for these topics
function deckItems(topics, includeMistakes, onlyUnknown) {
  const items = [];
  topics.forEach(l => {
    l.cards.forEach(c => {
      if (!onlyUnknown || c.level !== "confident")
        items.push({ kind: "card", front: c.q, back: c.a, ref: c, isMistake: !!c.fromMistake });
    });
    // Mistakes already turned into flashcards are in the deck above, so don't add them twice
    if (includeMistakes) l.mistakes.filter(m => !l.cards.some(c => c.fromMistake === m.id)).forEach(m => items.push({
      kind: "mistake",
      front: m.wrong,
      back: (m.right || "(no correct answer written yet)") + (m.how ? "\n\nHow to work it out:\n" + m.how : ""),
      cat: m.cat,
      ref: m,
      isMistake: true,
    }));
  });
  return items;
}
function dueSummary(topics) {
  const items = deckItems(topics, true, false);
  const due = items.filter(it => isDue(it.ref));
  const later = items.filter(it => !isDue(it.ref)).map(it => it.ref.srs.due).sort();
  return { due: due.length, fresh: due.filter(it => !it.ref.srs).length, next: later[0] || null, total: items.length };
}

// Mistakes and improving cards get extra goes in a round: one more for each
function weightedDeck(items) {
  const deck = shuffle(items.slice());
  const extras = [];
  items.forEach(it => {
    if (it.isMistake) extras.push(it);
    if (it.ref.level === "improving") extras.push(it);
  });
  // Put each extra go somewhere in the second half, never right next to the same card
  shuffle(extras).forEach(it => {
    const start = Math.ceil(deck.length / 2);
    const spots = [];
    for (let k = start; k <= deck.length; k++) if (deck[k - 1] !== it && deck[k] !== it) spots.push(k);
    deck.splice(spots.length ? spots[Math.floor(Math.random() * spots.length)] : deck.length, 0, it);
  });
  return deck;
}

// opts.spaced: only cards that are due (spaced repetition); otherwise every card, weighted
function startRevise(title, topics, includeMistakes, onlyUnknown = false, opts = {}) {
  const items = deckItems(topics, includeMistakes, onlyUnknown);
  if (!items.length) {
    alert(onlyUnknown ? "You're confident with all of these cards already — nice! Untick 'Only cards I'm not confident with yet' to go again."
                      : "There's nothing to revise yet. Add some flashcards first!");
    return;
  }
  const restart = () => startRevise(title, topics, includeMistakes, onlyUnknown, opts);
  if (opts.spaced) {
    const due = items.filter(it => isDue(it.ref));
    if (!due.length) {
      const next = items.map(it => it.ref.srs.due).sort()[0];
      if (confirm(`🎉 Nothing is due in this topic today! The next card is due ${niceDate(next)}.\n\nDo you want to practise everything anyway?`))
        runDeck(title, weightedDeck(items), { restart });
      return;
    }
    // Weakest first: mistakes and improving cards, then new, then the rest
    const rank = it => (it.isMistake || it.ref.level === "improving" ? 0 : !it.ref.srs ? 1 : 2);
    runDeck(title + " · spaced repetition", shuffle(due).sort((x, y) => rank(x) - rank(y)), { spaced: true, restart });
    return;
  }
  runDeck(title, weightedDeck(items), { restart });
}

function runDeck(title, deck, opts = {}) {
  closeRevise();
  overlay = document.createElement("div");
  overlay.className = "overlay";
  document.body.append(overlay);
  document.body.style.overflow = "hidden";
  let i = 0;
  const missed = [];
  const tally = { confident: 0, improving: 0, right: 0, answered: 0 };
  let flipped = false;
  let shownAt = 0, thinkSeconds = null;

  function show() {
    if (i >= deck.length) return finish();
    const card = deck[i];
    flipped = false;
    const cat = CATEGORIES[card.cat];
    const frontTag = card.kind === "mistake"
      ? `❌ ${cat ? cat.icon + " " + cat.label + " — " : ""}what's the right answer, and how do you work it out?` : "Question";
    const backTag = card.kind === "mistake" ? "✅ Correct answer" : "Answer";
    overlay.innerHTML = `
      <div class="top"><b>🧠 ${esc(title)}</b><span class="ov-timer" id="ovTimer">${dailyTimerText()}</span><button class="btn secondary" id="exit">✕ Exit</button></div>
      <div class="progress"><div style="width:${(i / deck.length) * 100}%"></div></div>
      <div class="hint">Card ${i + 1} of ${deck.length} · <span class="card-clock" id="cardClock">⏱️ 0.0s</span></div>
      <div class="flashcard" id="fc">
        <div class="inner">
          <div class="face"><span class="tag">${frontTag}</span>${esc(card.front)}</div>
          <div class="face back"><span class="tag">${backTag}</span>${esc(card.back)}</div>
        </div>
      </div>
      <div class="hint" id="hint">Click the card (or press Space) to flip it</div>
      <div class="answer-btns" id="btns" style="visibility:hidden">
        <button class="btn danger" id="no">✗ Still learning</button>
        <button class="btn good" id="yes">✓ Got it</button>
      </div>`;
    overlay.querySelector("#exit").onclick = () => closeRevise();
    overlay.querySelector("#fc").onclick = flip;
    overlay.querySelector("#yes").onclick = () => answer(true);
    overlay.querySelector("#no").onclick = () => answer(false);
    shownAt = Date.now();
    thinkSeconds = null;
  }
  // Live stopwatch for the current card; it stops when you flip the card
  overlay.clock = setInterval(() => {
    const el = overlay && overlay.querySelector("#cardClock");
    if (!el || thinkSeconds !== null) return;
    const sec = (Date.now() - shownAt) / 1000;
    el.textContent = `⏱️ ${sec.toFixed(1)}s`;
    el.classList.toggle("slow", sec > CONFIDENT_SECONDS);
  }, 100);
  function flip() {
    flipped = !flipped;
    overlay.querySelector("#fc").classList.toggle("flipped", flipped);
    overlay.querySelector("#btns").style.visibility = "visible";
    // The time to the first flip is how long you needed to think of the answer
    if (thinkSeconds === null) {
      thinkSeconds = (Date.now() - shownAt) / 1000;
      const el = overlay.querySelector("#cardClock");
      el.textContent = `⏱️ ${thinkSeconds.toFixed(1)}s`;
      el.classList.toggle("slow", thinkSeconds > CONFIDENT_SECONDS);
    }
    overlay.querySelector("#hint").innerHTML = `⏱️ You took <b>${thinkSeconds.toFixed(1)}s</b> — got it in under ${CONFIDENT_SECONDS}s counts as ⚡ confident.<br>Did you get it right? (← still learning · → got it)`;
  }
  function answer(gotIt) {
    const card = deck[i];
    const level = recordAnswer(card, gotIt, thinkSeconds);
    tally[level]++;
    tally.answered++;
    if (gotIt) tally.right++;
    if (!gotIt) {
      if (!missed.includes(card)) missed.push(card);
      // Spaced repetition: a card you got wrong comes back again a few cards later
      if (opts.spaced) deck.splice(Math.min(i + 4, deck.length), 0, card);
    }
    i++;
    show();
  }
  function finish() {
    clearInterval(overlay.clock);
    const score = tally.right;
    const pct = Math.round((score / tally.answered) * 100);
    const msg = pct === 100 ? "Perfect! 🎉" : pct >= 70 ? "Great work! 💪" : pct >= 40 ? "Good effort — keep going! 📈" : "Keep practising — you'll get there! 🌱";
    overlay.innerHTML = `
      <div class="result">
        <div class="big">${score} / ${tally.answered}</div>
        <p class="hint">right answers</p>
        <p style="font-size:1.2rem">${msg}</p>
        <p>${levelBadge("confident")} <b>${tally.confident}</b> &nbsp; ${levelBadge("improving")} <b>${tally.improving}</b></p>
        <p class="hint">Confident = got it right in under ${CONFIDENT_SECONDS} seconds.</p>
        <div class="answer-btns" style="justify-content:center;flex-wrap:wrap">
          ${missed.length ? `<button class="btn" id="again">🔁 Revise the ${missed.length} I missed</button>` : ""}
          <button class="btn secondary" id="all">${opts.spaced ? "Check for more due cards" : "Start over"}</button>
          <button class="btn secondary" id="done">Done</button>
        </div>
      </div>`;
    if (missed.length) overlay.querySelector("#again").onclick = () => runDeck(title, shuffle(missed.slice()), opts);
    overlay.querySelector("#all").onclick = () => { closeRevise(); render(); opts.restart(); };
    overlay.querySelector("#done").onclick = () => { closeRevise(); render(); };
  }

  overlay.keyHandler = e => {
    if (e.key === "Escape") return closeRevise();
    if (i >= deck.length) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
    else if (flipped && e.key === "ArrowRight") answer(true);
    else if (flipped && e.key === "ArrowLeft") answer(false);
  };
  document.addEventListener("keydown", overlay.keyHandler);
  show();
}

function closeRevise() {
  if (!overlay) return;
  document.removeEventListener("keydown", overlay.keyHandler);
  clearInterval(overlay.clock);
  overlay.remove();
  overlay = null;
  document.body.style.overflow = "";
}

// ---------- Revision board games ----------
// Every move needs a flashcard answered right first. Answers count just like in a revision round
// (confident / improving, spaced repetition, the study timer). You play against the computer,
// which "knows" each answer with a chance set by the difficulty.
const GAMES = {
  snakes:  { icon: "🐍", name: "Snakes & Ladders",  about: "Answer to roll the dice. Land on a ladder and answer to climb it; land on a snake and answer to escape it. First to 100 wins." },
  noughts: { icon: "⭕", name: "Noughts & Crosses", about: "Pick a square, then answer to claim it. Three in a row wins." },
  connect: { icon: "🔴", name: "Connect Four",      about: "Pick a column, then answer to drop your counter. Four in a row wins." },
  battle:  { icon: "🚢", name: "Battleships",       about: "Pick a square to fire at, then answer to take the shot. Sink all the computer's ships first." },
};
const DIFFICULTY = {
  easy:   { label: "😊 Easy",   skill: 0.45 },
  medium: { label: "🙂 Medium", skill: 0.65 },
  hard:   { label: "😤 Hard",   skill: 0.85 },
};
let gameChoice = "snakes", gameScope = "topic", gameLevel = "medium";

function renderGamesTab(body, topic, subject, year) {
  const scopes = {
    topic: { label: "📚 This topic",       name: topic.name,             topics: [topic] },
    year:  { label: `🎓 Whole of ${year}`, name: `${subject} · ${year}`, topics: topicsFor(subject, year) },
  };
  body.innerHTML = `<div class="panel">
      <p style="margin-top:0"><b>Pick a game</b> — you play against the computer, and every move needs a flashcard answered right.</p>
      <div class="grid" id="gameTiles" style="margin-bottom:16px"></div>
      <label class="check" style="margin-bottom:6px">Questions from</label>
      <div class="tabs" id="gameScope" style="margin-bottom:12px">${Object.entries(scopes).map(([k, sc]) =>
        `<button class="tab" data-v="${k}">${sc.label}</button>`).join("")}</div>
      <label class="check" style="margin-bottom:6px">How good is the computer?</label>
      <div class="tabs" id="gameLevel" style="margin-bottom:16px">${Object.entries(DIFFICULTY).map(([k, d]) =>
        `<button class="tab" data-v="${k}">${d.label}</button>`).join("")}</div>
      <button class="btn good" id="play">🎲 Play ${GAMES[gameChoice].name}</button>
    </div>`;
  const grid = body.querySelector("#gameTiles");
  Object.entries(GAMES).forEach(([key, g]) => {
    const tile = document.createElement("div");
    tile.className = "tile";
    if (key === gameChoice) tile.style.cssText = "border:2px solid var(--accent);background:rgba(79,107,237,0.08)";
    tile.innerHTML = `<div class="icon">${g.icon}</div><div class="name">${g.name}</div><div class="meta">${g.about}</div>`;
    tile.onclick = () => { gameChoice = key; render(); };
    grid.append(tile);
  });
  body.querySelectorAll("#gameScope .tab").forEach(b => {
    b.classList.toggle("active", b.dataset.v === gameScope);
    b.onclick = () => { gameScope = b.dataset.v; render(); };
  });
  body.querySelectorAll("#gameLevel .tab").forEach(b => {
    b.classList.toggle("active", b.dataset.v === gameLevel);
    b.onclick = () => { gameLevel = b.dataset.v; render(); };
  });
  body.querySelector("#play").onclick = () => {
    const sc = scopes[gameScope];
    const items = deckItems(sc.topics, true, false);
    if (!items.length) return alert("There's nothing to ask yet. Add some flashcards or mistakes to this topic first!");
    startGame(gameChoice, items, gameLevel, sc.name);
  };
}

// Picks the next question: mistakes and improving cards come up most, and nothing repeats too soon
function questionPicker(items) {
  const recent = [];
  const weight = it => (it.isMistake || it.ref.level === "improving" ? 3 : !it.ref.level ? 2 : 1);
  return () => {
    const pool = items.filter(it => !recent.includes(it));
    const from = pool.length ? pool : items;
    let r = Math.random() * from.reduce((n, it) => n + weight(it), 0);
    const pick = from.find(it => (r -= weight(it)) < 0) || from[0];
    recent.push(pick);
    while (recent.length > Math.min(5, items.length - 1)) recent.shift();
    return pick;
  };
}

function startGame(kind, items, levelKey, title) {
  closeRevise();
  overlay = document.createElement("div");
  overlay.className = "overlay";
  document.body.append(overlay);
  document.body.style.overflow = "hidden";
  const me = overlay;
  overlay.innerHTML = `
    <div class="top"><b>${GAMES[kind].icon} ${GAMES[kind].name}</b><span class="ov-timer" id="ovTimer">${dailyTimerText()}</span><button class="btn secondary" id="exit">✕ Exit</button></div>
    <div class="game game-live"><div class="status" id="gStatus"></div><div id="gBoard" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px"></div></div>`;
  overlay.querySelector("#exit").onclick = () => { closeRevise(); render(); };
  const game = {
    asked: 0, right: 0,
    board: overlay.querySelector("#gBoard"),
    next: questionPicker(items),
    alive: () => overlay === me,
    status: html => { const el = me.querySelector("#gStatus"); if (el) el.innerHTML = html; },
    // Waits, but never carries on once the game has been closed
    wait: ms => new Promise(r => setTimeout(() => { if (overlay === me) r(); }, ms)),
    cpuKnows: () => Math.random() < DIFFICULTY[levelKey].skill,
    ask: why => askQuestion(game, game.next(), why),
    // Shows a button under the status line and waits for it to be pressed
    button: label => new Promise(r => {
      const b = document.createElement("button");
      b.className = "btn good";
      b.style.marginLeft = "8px";
      b.textContent = label;
      b.onclick = () => { b.remove(); r(); };
      me.querySelector("#gStatus").append(b);
      b.focus();
    }),
    end: result => endGame(game, result, () => startGame(kind, items, levelKey, title)),
  };
  ({ snakes: playSnakes, noughts: playNoughts, connect: playConnect, battle: playBattle })[kind](game);
}

// The flashcard pop-up used by every game. Resolves true if you got it right.
function askQuestion(game, item, why) {
  return new Promise(resolve => {
    const box = document.createElement("div");
    box.className = "qmodal";
    const mistake = item.kind === "mistake";
    box.innerHTML = `<div class="qcard">
        <div class="hint" style="margin:0 0 10px"><b>${why}</b></div>
        <div class="qtag">${mistake ? "❌ I got this wrong — what's the right answer?" : "Question"} · <span class="card-clock" id="qClock">⏱️ 0.0s</span></div>
        <div class="qfront">${esc(item.front)}</div>
        <div class="qback" hidden><div class="qtag">${mistake ? "✅ Correct answer" : "Answer"}</div>${esc(item.back)}</div>
        <div class="answer-btns" style="justify-content:center;flex-wrap:wrap">
          <button class="btn" id="qShow">Show answer</button>
          <button class="btn danger" id="qNo" hidden>✗ Still learning</button>
          <button class="btn good" id="qYes" hidden>✓ Got it</button>
        </div>
        <div class="hint" id="qHint" style="margin:10px 0 0">Think of the answer, then tap Show answer (or press Space)</div>
      </div>`;
    overlay.querySelector(".game").append(box);
    const $ = sel => box.querySelector(sel);
    const shownAt = Date.now();
    let secs = null;
    const clock = setInterval(() => {
      if (!box.isConnected) return clearInterval(clock);
      if (secs !== null) return;
      const t = (Date.now() - shownAt) / 1000;
      $("#qClock").textContent = `⏱️ ${t.toFixed(1)}s`;
      $("#qClock").classList.toggle("slow", t > CONFIDENT_SECONDS);
    }, 100);
    const reveal = () => {
      if (secs !== null) return;
      secs = (Date.now() - shownAt) / 1000;
      $("#qClock").textContent = `⏱️ ${secs.toFixed(1)}s`;
      $("#qClock").classList.toggle("slow", secs > CONFIDENT_SECONDS);
      $(".qback").hidden = false;
      $("#qShow").hidden = true;
      $("#qNo").hidden = $("#qYes").hidden = false;
      $("#qHint").textContent = "Did you get it right? (← still learning · → got it)";
    };
    const finish = gotIt => {
      clearInterval(clock);
      document.removeEventListener("keydown", keys);
      recordAnswer(item, gotIt, secs);
      game.asked++;
      if (gotIt) game.right++;
      box.remove();
      resolve(gotIt);
    };
    const keys = e => {
      if (!box.isConnected) return document.removeEventListener("keydown", keys);
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveal(); }
      else if (secs !== null && e.key === "ArrowRight") finish(true);
      else if (secs !== null && e.key === "ArrowLeft") finish(false);
    };
    document.addEventListener("keydown", keys);
    $("#qShow").onclick = reveal;
    $("#qYes").onclick = () => finish(true);
    $("#qNo").onclick = () => finish(false);
  });
}

function endGame(game, result, playAgain) {
  if (!game.alive()) return;
  overlay.querySelector(".game").classList.remove("game-live");
  const text = { win: ["🏆", "You win!"], lose: ["🤖", "The computer wins this time"], draw: ["🤝", "It's a draw!"] }[result];
  // Shown above the board (not over it) so you can still see how the game finished
  const box = document.createElement("div");
  box.className = "game-result";

      <div style="font-size:3rem">${text[0]}</div>
      <h2 style="margin:6px 0">${text[1]}</h2>
      <p>You answered <b>${game.right} of ${plural(game.asked, "question")}</b> right.</p>
      <div class="answer-btns" style="justify-content:center;flex-wrap:wrap">
        <button class="btn good" id="again">🔁 Play again</button>
        <button class="btn secondary" id="done">Done</button>
      </div>
    </div>`;
  overlay.querySelector(".game").prepend(box);

}

// Lines of `need` in a row on a rows × cols grid; cells are indexed row * cols + col
function lines(rows, cols, need) {
  const out = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    [[0, 1], [1, 0], [1, 1], [1, -1]].forEach(([dr, dc]) => {
      const line = [];
      for (let k = 0; k < need; k++) {
        const rr = r + dr * k, cc = c + dc * k;
        if (rr < 0 || rr >= rows || cc < 0 || cc >= cols) return;
        line.push(rr * cols + cc);
      }
      out.push(line);
    });
  return out;
}
function winner(cells, allLines) {
  const line = allLines.find(l => cells[l[0]] && l.every(i => cells[i] === cells[l[0]]));
  return line ? { who: cells[line[0]], line } : null;
}
function randomOf(list) { return list[Math.floor(Math.random() * list.length)]; }

// ---------- Snakes & Ladders ----------
const SNAKES  = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
const LADDERS = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };

async function playSnakes(game) {
  const pos = { you: 0, cpu: 0 };
  const who = { you: "🧑 You", cpu: "🤖 Computer" };
  game.board.innerHTML = `<div class="sl-board"></div>
    <div class="hint" style="margin:0">🧑 You: <b id="slYou">start</b> · 🤖 Computer: <b id="slCpu">start</b> · 🪜 ladder up · 🐍 snake down</div>`;
  const grid = game.board.querySelector(".sl-board");
  // Square 1 is bottom-left and the numbers snake back and forth up the board
  for (let row = 9; row >= 0; row--) for (let col = 0; col < 10; col++) {
    const n = row * 10 + (row % 2 ? 10 - col : col + 1);
    const cell = document.createElement("div");
    cell.className = "sl-cell" + ((row + col) % 2 ? " alt" : "");
    cell.dataset.n = n;
    if (LADDERS[n]) cell.title = `Ladder up to ${LADDERS[n]}`;
    if (SNAKES[n]) cell.title = `Snake down to ${SNAKES[n]}`;
    // On a phone the small "↑38" labels are hidden, so tapping a square says where it goes
    if (cell.title) cell.onclick = () => game.status(`${LADDERS[n] ? "🪜" : "🐍"} Square ${n}: ${cell.title.toLowerCase()}`);
    cell.innerHTML = `<span>${n}</span>${LADDERS[n] ? `<span class="mark">🪜<small>↑${LADDERS[n]}</small></span>` : ""}${SNAKES[n] ? `<span class="mark">🐍<small>↓${SNAKES[n]}</small></span>` : ""}<span class="tokens"></span>`;
    grid.append(cell);
  }
  const draw = () => {
    grid.querySelectorAll(".tokens").forEach(t => t.textContent = "");
    ["you", "cpu"].forEach(p => {
      const cell = grid.querySelector(`[data-n="${pos[p]}"] .tokens`);
      if (cell) cell.textContent += p === "you" ? "🧑" : "🤖";
    });
    game.board.querySelector("#slYou").textContent = pos.you || "start";
    game.board.querySelector("#slCpu").textContent = pos.cpu || "start";
  };
  draw();
  const roll = async () => {
    for (let k = 0; k < 6; k++) { game.status(`🎲 ${1 + Math.floor(Math.random() * 6)}`); await game.wait(80); }
    return 1 + Math.floor(Math.random() * 6);
  };
  let turn = "you";
  while (true) {
    const you = turn === "you";
    let ok;
    if (you) {
      game.status("Your turn!");
      await game.button("🎲 Answer to roll");
      ok = await game.ask("Get it right to roll the dice 🎲");
    } else {
      game.status("🤖 The computer is answering a question…");
      await game.wait(900);
      ok = game.cpuKnows();
    }
    if (!ok) {
      game.status(you ? "❌ Not this time — no roll for you." : "🤖 The computer got its question wrong — no roll!");
      await game.wait(1300);
    } else {
      const n = await roll();
      const target = pos[turn] + n;
      if (target > 100) {
        game.status(`🎲 ${who[turn]} rolled a <b>${n}</b> — you need exactly ${100 - pos[turn]} to finish, so no move.`);
        await game.wait(1500);
      } else {
        game.status(`🎲 ${who[turn]} rolled a <b>${n}</b>!`);
        for (let k = 0; k < n; k++) { pos[turn]++; draw(); await game.wait(160); }
        const ladder = LADDERS[pos[turn]], snake = SNAKES[pos[turn]];
        if (ladder || snake) {
          let right;
          if (you) right = await game.ask(ladder ? `🪜 A ladder to ${ladder}! Get it right to climb it` : `🐍 A snake down to ${snake}! Get it right to escape it`);
          else { game.status(`🤖 The computer landed on a ${ladder ? "ladder 🪜" : "snake 🐍"} and is answering…`); await game.wait(1000); right = game.cpuKnows(); }
          if (ladder && right) { pos[turn] = ladder; game.status(`🪜 ${who[turn]} climbed to <b>${ladder}</b>!`); }
          else if (ladder) game.status(`🪜 ${who[turn]} missed the ladder.`);
          else if (right) game.status(`🐍 ${who[turn]} escaped the snake!`);
          else { pos[turn] = snake; game.status(`🐍 ${who[turn]} slid down to <b>${snake}</b>.`); }
          draw();
          await game.wait(1400);
        } else {
          await game.wait(500);
        }
        if (pos[turn] === 100) return game.end(you ? "win" : "lose");
      }
    }
    turn = you ? "cpu" : "you";
  }
}

// ---------- Noughts & Crosses ----------
async function playNoughts(game) {
  const cells = Array(9).fill(null);
  const LINES = lines(3, 3, 3);
  game.board.innerHTML = `<div class="ttt"></div><div class="hint" style="margin:0">You are ✖️ · the computer is ⭕</div>`;
  const grid = game.board.querySelector(".ttt");
  let pick = null;
  const draw = (highlight = []) => {
    grid.innerHTML = "";
    cells.forEach((v, i) => {
      const b = document.createElement("button");
      b.textContent = v === "X" ? "✖️" : v === "O" ? "⭕" : "";
      if (highlight.includes(i)) b.classList.add("win");
      b.disabled = !!v;
      b.onclick = () => { if (pick && !cells[i]) { const r = pick; pick = null; r(i); } };
      grid.append(b);
    });
  };
  // Computer: win if it can, block you, then centre, corners, anything
  const cpuMove = () => {
    const free = cells.map((v, i) => (v ? null : i)).filter(i => i !== null);
    for (const mark of ["O", "X"]) for (const i of free) {
      const test = cells.slice(); test[i] = mark;
      if (winner(test, LINES)) return i;
    }
    if (!cells[4]) return 4;
    const corners = [0, 2, 6, 8].filter(i => !cells[i]);
    return corners.length ? randomOf(corners) : randomOf(free);
  };
  let turn = "you";
  draw();
  while (true) {
    if (turn === "you") {
      game.status("Your turn — tap a square to claim");
      const i = await new Promise(r => { pick = r; });
      if (await game.ask("Get it right to claim the square ✖️")) { cells[i] = "X"; game.status("✖️ Square claimed!"); }
      else game.status("❌ Missed it — the square stays empty.");
    } else {
      game.status("🤖 The computer is answering a question…");
      await game.wait(900);
      const i = cpuMove();
      if (game.cpuKnows()) { cells[i] = "O"; game.status("🤖 The computer claimed a square ⭕"); }
      else game.status("🤖 The computer got its question wrong!");
    }
    const w = winner(cells, LINES);
    draw(w ? w.line : []);
    if (w) { await game.wait(1000); return game.end(w.who === "X" ? "win" : "lose"); }
    if (cells.every(Boolean)) { await game.wait(800); return game.end("draw"); }
    await game.wait(900);
    turn = turn === "you" ? "cpu" : "you";
  }
}

// ---------- Connect Four ----------
async function playConnect(game) {
  const ROWS = 6, COLS = 7;
  const cells = Array(ROWS * COLS).fill(null);
  const LINES = lines(ROWS, COLS, 4);
  game.board.innerHTML = `<div class="c4"></div><div class="hint" style="margin:0">You are <span style="color:#e5484d">●</span> red · the computer is <span style="color:#d4a400">●</span> yellow</div>`;
  const grid = game.board.querySelector(".c4");
  let pick = null;
  const lowest = col => { for (let r = ROWS - 1; r >= 0; r--) if (!cells[r * COLS + col]) return r * COLS + col; return -1; };
  const draw = (highlight = []) => {
    grid.innerHTML = "";
    cells.forEach((v, i) => {
      const d = document.createElement("div");
      d.className = "slot" + (v ? " " + v : "") + (highlight.includes(i) ? " win" : "");
      d.onclick = () => { const col = i % COLS; if (pick && lowest(col) >= 0) { const r = pick; pick = null; r(col); } };
      grid.append(d);
    });
  };
  // Computer: win if it can, block you, otherwise prefer the middle columns
  const cpuMove = () => {
    const open = [...Array(COLS).keys()].filter(c => lowest(c) >= 0);
    for (const mark of ["cpu", "you"]) for (const c of open) {
      const test = cells.slice(); test[lowest(c)] = mark;
      if (winner(test, LINES)) return c;
    }
    const weighted = open.flatMap(c => Array(4 - Math.abs(3 - c)).fill(c));
    return randomOf(weighted);
  };
  let turn = "you";
  draw();
  while (true) {
    if (turn === "you") {
      game.status("Your turn — tap a column to drop your counter");
      const col = await new Promise(r => { pick = r; });
      if (await game.ask("Get it right to drop your counter 🔴")) { cells[lowest(col)] = "you"; game.status("🔴 Counter dropped!"); }
      else game.status("❌ Missed it — no counter this turn.");
    } else {
      game.status("🤖 The computer is answering a question…");
      await game.wait(900);
      const col = cpuMove();
      if (game.cpuKnows()) { cells[lowest(col)] = "cpu"; game.status("🤖 The computer dropped a counter 🟡"); }
      else game.status("🤖 The computer got its question wrong!");
    }
    const w = winner(cells, LINES);
    draw(w ? w.line : []);
    if (w) { await game.wait(1000); return game.end(w.who === "you" ? "win" : "lose"); }
    if (cells.every(Boolean)) { await game.wait(800); return game.end("draw"); }
    await game.wait(900);
    turn = turn === "you" ? "cpu" : "you";
  }
}

// ---------- Battleships ----------
const BS_SIZE = 8, BS_SHIPS = [4, 3, 3, 2];
function placeShips() {
  const ships = [];
  const taken = new Set();
  BS_SHIPS.forEach(len => {
    while (true) {
      const across = Math.random() < 0.5;
      const r = Math.floor(Math.random() * (across ? BS_SIZE : BS_SIZE - len + 1));
      const c = Math.floor(Math.random() * (across ? BS_SIZE - len + 1 : BS_SIZE));
      const squares = [...Array(len).keys()].map(k => (across ? r * BS_SIZE + c + k : (r + k) * BS_SIZE + c));
      if (squares.some(i => taken.has(i))) continue;
      squares.forEach(i => taken.add(i));
      ships.push(squares);
      break;
    }
  });
  return ships;
}

async function playBattle(game) {
  const fleets = { you: placeShips(), cpu: placeShips() };
  const shots = { you: new Set(), cpu: new Set() }; // squares each side has fired at
  const shipAt = (side, i) => fleets[side].find(s => s.includes(i));
  const sunk = (side, ship) => ship.every(i => shots[side === "you" ? "cpu" : "you"].has(i));
  const allSunk = side => fleets[side].every(s => sunk(side, s));
  game.board.innerHTML = `<div class="hint" style="margin:0"><b>The computer's sea</b> — tap a square to fire</div>
    <div class="bs" id="enemy"></div>
    <div class="hint" style="margin:0"><b>Your ships</b></div>
    <div class="bs small" id="mine"></div>
    <div class="bs-key">
      <span><span class="sq hit">💥</span> Hit</span>
      <span><span class="sq sunk">🔥</span> Ship sunk</span>
      <span><span class="sq miss">💦</span> Miss</span>
      <span><span class="sq ship"></span> Your ship</span>
      <span><span class="sq last"></span> Last shot</span>
    </div>
    <div class="hint" style="margin:0">Ships are ${BS_SHIPS.join(", ")} squares long</div>`;
  let pick = null;
  const last = { you: null, cpu: null }; // each side's latest shot, ringed in yellow
  // How a square looks once it has been fired at
  const shotLook = (side, i) => {
    const ship = shipAt(side, i);
    if (!ship) return { cls: " miss", mark: "💦" };
    return sunk(side, ship) ? { cls: " sunk", mark: "🔥" } : { cls: " hit", mark: "💥" };
  };
  const draw = () => {
    const enemy = game.board.querySelector("#enemy"), mine = game.board.querySelector("#mine");
    enemy.innerHTML = mine.innerHTML = "";
    for (let i = 0; i < BS_SIZE * BS_SIZE; i++) {
      const e = document.createElement("div");
      const eLook = shots.you.has(i) ? shotLook("cpu", i) : { cls: " open", mark: "" };
      e.className = "sq" + eLook.cls + (last.you === i ? " last" : "");
      e.textContent = eLook.mark;
      e.onclick = () => { if (pick && !shots.you.has(i)) { const r = pick; pick = null; r(i); } };
      enemy.append(e);
      const m = document.createElement("div");
      const mLook = shots.cpu.has(i) ? shotLook("you", i) : { cls: shipAt("you", i) ? " ship" : "", mark: "" };
      m.className = "sq" + mLook.cls + (last.cpu === i ? " last" : "");
      m.textContent = mLook.mark;
      mine.append(m);
    }
  };
  // Computer: fire next to a hit it hasn't finished sinking, otherwise anywhere on a checkerboard
  const cpuTarget = () => {
    const free = i => i >= 0 && i < BS_SIZE * BS_SIZE && !shots.cpu.has(i);
    const hits = [...shots.cpu].filter(i => { const s = shipAt("you", i); return s && !sunk("you", s); });
    const near = hits.flatMap(i => {
      const r = Math.floor(i / BS_SIZE), c = i % BS_SIZE;
      return [r > 0 ? i - BS_SIZE : -1, r < BS_SIZE - 1 ? i + BS_SIZE : -1, c > 0 ? i - 1 : -1, c < BS_SIZE - 1 ? i + 1 : -1];
    }).filter(free);
    if (near.length) return randomOf(near);
    const open = [...Array(BS_SIZE * BS_SIZE).keys()].filter(free);
    const checker = open.filter(i => (Math.floor(i / BS_SIZE) + i) % 2 === 0);
    return randomOf(checker.length ? checker : open);
  };
  const fire = (side, i) => {
    shots[side].add(i);
    last[side] = i;
    const target = side === "you" ? "cpu" : "you";
    const ship = shipAt(target, i);
    draw();
    if (!ship) return "💦 <b>Miss</b> — just water.";
    return sunk(target, ship) ? `🔥 <b>Hit — and a ${ship.length}-square ship is sunk!</b>` : "💥 <b>Hit!</b>";
  };
  let turn = "you";
  draw();
  while (true) {
    if (turn === "you") {
      game.status("Your turn — tap a square on the computer's sea");
      const i = await new Promise(r => { pick = r; });
      if (await game.ask("Get it right to fire 🚀")) game.status(fire("you", i));
      else game.status("❌ Missed the question — your shot goes wide.");
      if (allSunk("cpu")) { await game.wait(1000); return game.end("win"); }
    } else {
      game.status("🤖 The computer is answering a question…");
      await game.wait(900);
      if (game.cpuKnows()) game.status("🤖 The computer fires… " + fire("cpu", cpuTarget()));
      else game.status("🤖 The computer got its question wrong — no shot!");
      if (allSunk("you")) { await game.wait(1000); return game.end("lose"); }
    }
    await game.wait(1300);
    turn = turn === "you" ? "cpu" : "you";
  }
}

// ---------- Streak & study timer ----------
// data.stats.days["2026-10-22"] = seconds spent studying that day.
// Time only counts on learning screens (see isLearning), while the page is open, visible
// and you've done something in the last 2 minutes.
const STREAK_SECONDS = 60;          // a day counts towards the streak after 1 minute
const IDLE_AFTER = 2 * 60 * 1000;
let lastActivity = Date.now();
let unsavedSeconds = 0;

function studyDays() {
  data.stats = data.stats || {};
  data.stats.days = data.stats.days || {};
  return data.stats.days;
}
function addDays(iso, n) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + n));
  return dt.toISOString().slice(0, 10);
}
function fmtTime(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${String(s).padStart(2, "0")}s`;
  return `${s}s`;
}
function streaks() {
  const days = studyDays();
  const counts = d => (days[d] || 0) >= STREAK_SECONDS;
  // Today still to play for: the streak is alive if yesterday counted
  let d = counts(today()) ? today() : addDays(today(), -1);
  let current = 0;
  while (counts(d)) { current++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  Object.keys(days).filter(counts).sort().forEach(day => {
    run = prev && addDays(prev, 1) === day ? run + 1 : 1;
    best = Math.max(best, run);
    prev = day;
  });
  return { current, best, todayCounts: counts(today()) };
}
function record() {
  let best = { day: null, sec: 0 };
  Object.entries(studyDays()).forEach(([day, sec]) => { if (day !== today() && sec > best.sec) best = { day, sec }; });
  return best;
}

// The parts of the home screen that change every second
function todayParts() {
  const days = studyDays();
  const now = days[today()] || 0;
  const yest = days[addDays(today(), -1)] || 0;
  let msg, pct;
  if (!yest) { msg = "No study yesterday, so any time today beats it!"; pct = now ? 100 : 0; }
  else if (now < yest) { msg = `<b>${fmtTime(yest - now)}</b> more to match yesterday (${fmtTime(yest)})`; pct = (now / yest) * 100; }
  else if (now < yest + 60) { msg = `🤝 You've matched yesterday's ${fmtTime(yest)}! Keep going to beat it`; pct = 100; }
  else { msg = `🎉 You've beaten yesterday by <b>${fmtTime(now - yest)}</b>!`; pct = 100; }
  const rec = record();
  const recMsg = !rec.day ? "Your best day will show here."
    : now > rec.sec ? "🎉 Today is a new record!"
    : `${fmtTime(rec.sec - now)} more today to beat it`;
  return { now, msg, pct, recMsg };
}

// ---------- Flashcard confidence ----------
// Each go at a card is rated: right in under CONFIDENT_SECONDS = confident, otherwise improving.
// data.stats.cards["2026-10-22"] = { cardId: "confident" | "improving" } (your latest go at each card that day)
const CONFIDENT_SECONDS = 10;
const LEVELS = {
  confident: { icon: "⚡", label: "Confident", css: "var(--confident)" },
  improving: { icon: "📈", label: "Improving", css: "var(--improving)" },
};
function levelBadge(level) {
  const l = LEVELS[level];
  return l ? `<span class="badge level-${level}">${l.icon} ${l.label}</span> ` : "";
}
function cardLog() {
  data.stats = data.stats || {};
  data.stats.cards = data.stats.cards || {};
  return data.stats.cards;
}
function logCardResult(id, level) {
  const log = cardLog();
  (log[today()] = log[today()] || {})[id] = level;
}
function dayLevels(day) {
  const counts = { confident: 0, improving: 0 };
  Object.values(cardLog()[day] || {}).forEach(l => counts[l]++);
  return counts;
}
// Where every flashcard stands right now, across all subjects
function allCardLevels() {
  const counts = { confident: 0, improving: 0, untried: 0 };
  SUBJECTS.forEach(s => Object.values(data[s.name] || {}).forEach(topics => topics.forEach(t =>
    t.cards.forEach(c => counts[LEVELS[c.level] ? c.level : "untried"]++))));
  return counts;
}

function renderCardChart(box) {

      <span class="legend"><span><i style="background:var(--confident)"></i>⚡ Confident</span><span><i style="background:var(--improving)"></i>📈 Improving</span></span>
    </div>
    <div class="bars"></div><div class="labels"></div>`;
  const bars = box.querySelector(".bars"), labels = box.querySelector(".labels");
  list.forEach((d, i) => {

    col.className = "col stack" + (d === today() ? " today" : "");
    // Improving on top, confident at the base
    col.innerHTML = ["improving", "confident"].filter(k => c[k]).map(k =>
      `<div class="seg" style="height:${(c[k] / max) * 100}%;background:${LEVELS[k].css}"></div>`).join("");
    col.onmousemove = e => showTip(e, `${d === today() ? "Today" : niceDate(d)}: ⚡ ${c.confident} confident · 📈 ${c.improving} improving`);
